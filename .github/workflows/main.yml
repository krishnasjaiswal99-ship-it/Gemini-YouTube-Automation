name: Autonomous AI Course Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and patch ImageMagick
        run: |
          # Skip apt-get to prevent network timeouts
          POLICY_FILE=$(find /etc -name "policy.xml" 2>/dev/null | grep -i "ImageMagick" | head -n 1)
          if [ -n "$POLICY_FILE" ]; then
            echo "Found policy file at: $POLICY_FILE, applying patches..."
            sudo sed -i 's/<policy domain="resource" name="width" value=".*"\/>/<policy domain="resource" name="width" value="16KP"\/>/' $POLICY_FILE
            sudo sed -i 's/<policy domain="resource" name="height" value=".*"\/>/<policy domain="resource" name="height" value="16KP"\/>/' $POLICY_FILE
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore API credentials from base64
        run: |
          echo "${{ secrets.CLIENT_SECRET_B64 }}" | base64 -d > client_secrets.json
          echo "${{ secrets.CREDENTIALS_B64 }}" | base64 -d > credentials.json

      - name: Run Autonomous Production Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Commit and push content plan changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add content_plan.json
          git commit -m "Update content plan after daily video production" || echo "No changes to commit"
          git push
